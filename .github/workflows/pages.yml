name: Build and deploy Shinobi Rogue Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fL --retry 3 -o /tmp/godot.zip "${BASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "${BASE}/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          rm -rf "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          godot --version

      - name: Reconstruct title screen asset
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cat art/title_screen.b64.* | base64 --decode > art/title_screen.jpg
          test -s art/title_screen.jpg
          test "$(wc -c < art/title_screen.jpg)" -eq 43129
          echo "f22a5daf2f805e9c31d9ad7865db516835f83d4cebcb9025db0affccc29697d4  art/title_screen.jpg" | sha256sum -c -
          echo "[TITLE] reconstructed and verified"

      - name: Apply adopted portrait UI and gameplay patches
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          echo "[PATCH] final portrait UI"
          python3 tools/apply_final_portrait_ui.py
          echo "[PATCH] centered camera"
          python3 tools/apply_centered_portrait_camera.py
          echo "[PATCH] character clarity"
          python3 tools/apply_character_clarity.py
          echo "[PATCH] direction + projectile"
          python3 tools/apply_direction_projectile.py
          echo "[PATCH] room + corridor floor"
          python3 tools/apply_torneko_floor.py
          echo "[PATCH] restore existing shop rules"
          python3 tools/apply_shop_rules_restore.py
          echo "[PATCH] directional player + larger overlay map"
          python3 tools/apply_directional_player_map_overlay.py
          echo "[PATCH] title screen"
          python3 tools/apply_title_screen.py
          echo "[PATCH] all patches complete"

      - name: Regression and Web export
        shell: bash
        timeout-minutes: 12
        env:
          SHINOBI_IMPORT_TIMEOUT: "120"
          SHINOBI_REGRESSION_TIMEOUT: "180"
          SHINOBI_EXPORT_TIMEOUT: "300"
        run: |
          set -euo pipefail
          echo "[BUILD] start $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          chmod +x BUILD_WEB_LINUX.sh
          ./BUILD_WEB_LINUX.sh
          echo "[BUILD] script complete $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          test -s web/index.html
          test -s web/index.js
          test -s web/index.pck
          test -s web/index.wasm
          echo "WASM size: $(wc -c < web/index.wasm) bytes"

      - name: Cache-safe Web package and remove stale PWA cache
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # Godot exports several large files under the fixed "index" name. GitHub
          # Pages may cache those files for ten minutes, so an HTML update could
          # otherwise load a mixture of old and new engine/package files.
          BUILD_ID="shinobi-${GITHUB_SHA:0:12}"
          export BUILD_ID
          for suffix in js pck wasm audio.worklet.js audio.position.worklet.js side.wasm; do
            if [[ -f "web/index.${suffix}" ]]; then
              mv "web/index.${suffix}" "web/${BUILD_ID}.${suffix}"
            fi
          done

          cat > web/index.service.worker.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
              await self.registration.unregister();
            })());
          });
          self.addEventListener('fetch', (event) => {
            event.respondWith(fetch(event.request));
          });
          JS
          python3 - <<'PY'
          import os
          from pathlib import Path

          build_id = os.environ['BUILD_ID']
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('src="index.js"', f'src="{build_id}.js"')
          s = s.replace('"executable":"index"', f'"executable":"{build_id}"')
          s = s.replace('"index.pck":', f'"{build_id}.pck":')
          s = s.replace('"index.wasm":', f'"{build_id}.wasm":')

          cache_meta = '''<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
          <meta http-equiv="Pragma" content="no-cache">
          <meta http-equiv="Expires" content="0">'''
          # Unique package names already prevent stale data. Avoid touching an
          # active service worker while Safari is starting WebAssembly.
          s = s.replace('</head>', cache_meta + '\n</head>', 1)

          # Keep the render buffer at the game's native portrait size. Safari
          # otherwise allocates it at the iPhone's high pixel density, which can
          # terminate the tab while textures and WebAssembly are loading.
          s = s.replace('<canvas id="canvas">', '<canvas id="canvas" width="720" height="1100">', 1)
          s = s.replace('"canvasResizePolicy":2', '"canvasResizePolicy":0', 1)
          s = s.replace('#canvas {\n\tdisplay: block;\n}', '#canvas {\n\tdisplay: block;\n\twidth: 100vw;\n\theight: 100dvh;\n}', 1)

          progress = '<progress id="status-progress"></progress>'
          loading = progress + '''
              <div style="margin-top:12px;color:#ead7ae;font:600 14px sans-serif;text-align:center">読み込み中… 初回は30〜60秒ほどかかる場合があります</div>'''
          s = s.replace(progress, loading, 1)

          old_error = "const missingMsg = 'Error\\nThe following features required to run Godot projects on the Web are missing:\\n';"
          new_error = "const missingMsg = '起動できません\\nこのブラウザはゲーム表示機能に対応していません。iPhone・iPadではSafariで開いてください。\\n';"
          s = s.replace(old_error, new_error, 1)
          p.write_text(s, encoding='utf-8')
          PY

          test -s "web/${BUILD_ID}.js"
          test -s "web/${BUILD_ID}.pck"
          test -s "web/${BUILD_ID}.wasm"
          grep -Fq "\"executable\":\"${BUILD_ID}\"" web/index.html
          grep -Fq "src=\"${BUILD_ID}.js\"" web/index.html
          grep -Fq '"canvasResizePolicy":0' web/index.html
          grep -Fq 'width="720" height="1100"' web/index.html
          if grep -Fq 'src="index.js"' web/index.html; then
            echo "Fixed-name JavaScript reference remains" >&2
            exit 1
          fi
          touch web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
