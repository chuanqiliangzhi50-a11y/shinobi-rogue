name: Build and deploy Shinobi Rogue Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION="4.7.2-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl -fL --retry 3 -o /tmp/godot.zip "${BASE}/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 -o /tmp/templates.tpz "${BASE}/Godot_v4.7.2-stable_export_templates.tpz"
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          rm -rf "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          godot --version

      - name: Regression and Web export
        shell: bash
        run: |
          set -euo pipefail
          chmod +x BUILD_WEB_LINUX.sh
          ./BUILD_WEB_LINUX.sh
          test -s web/index.html
          test -s web/index.js
          test -s web/index.pck
          test -s web/index.wasm
          echo "WASM size: $(wc -c < web/index.wasm) bytes"

      - name: Remove stale PWA cache and add iPhone diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat > web/index.service.worker.js <<'JS'
          self.addEventListener('install', () => self.skipWaiting());
          self.addEventListener('activate', (event) => {
            event.waitUntil((async () => {
              const keys = await caches.keys();
              await Promise.all(keys.map((key) => caches.delete(key)));
              await self.registration.unregister();
              const windows = await self.clients.matchAll({ type: 'window', includeUncontrolled: true });
              for (const client of windows) {
                if ('navigate' in client) client.navigate(client.url);
              }
            })());
          });
          self.addEventListener('fetch', (event) => event.respondWith(fetch(event.request)));
          JS
          python3 - <<'PY'
          from pathlib import Path
          p = Path('web/index.html')
          s = p.read_text(encoding='utf-8')
          patch = r'''<script>
          (() => {
            const lines = [];
            const add = (m) => {
              lines.push(String(m));
              const el = document.getElementById('shinobi-diag');
              if (el) el.textContent = lines.join('\n');
            };
            window.__shinobiDiag = add;
            window.addEventListener('error', e => add('JS ERROR: ' + (e.message || e.error || 'unknown')));
            window.addEventListener('unhandledrejection', e => add('PROMISE ERROR: ' + (e.reason?.message || e.reason || 'unknown')));
            document.addEventListener('DOMContentLoaded', async () => {
              const box = document.createElement('pre');
              box.id = 'shinobi-diag';
              box.style.cssText = 'position:fixed;left:8px;top:8px;z-index:2147483647;max-width:calc(100vw - 16px);white-space:pre-wrap;background:rgba(0,0,0,.82);color:#fff;padding:7px;font:11px/1.3 monospace;border-radius:5px;pointer-events:none';
              document.body.appendChild(box);
              add('SHINOBI BOOT DIAG 1.0.54');
              try {
                const c = document.createElement('canvas');
                add('WebGL2: ' + (c.getContext('webgl2') ? 'OK' : 'NG'));
              } catch (e) { add('WebGL2 ERROR: ' + e); }
              add('WebAssembly: ' + (typeof WebAssembly === 'object' ? 'OK' : 'NG'));
              for (const f of ['index.wasm', 'index.pck']) {
                try {
                  const r = await fetch(f, {method:'HEAD', cache:'no-store'});
                  add(f + ': HTTP ' + r.status + ' ' + (r.headers.get('content-type') || 'no-type') + ' len=' + (r.headers.get('content-length') || '?'));
                } catch (e) { add(f + ' HEAD ERROR: ' + e); }
              }
              setTimeout(() => add('8s: Godot still loading if this box is visible'), 8000);
            });
            if ('serviceWorker' in navigator) {
              window.addEventListener('load', async () => {
                try {
                  const regs = await navigator.serviceWorker.getRegistrations();
                  for (const reg of regs) await reg.unregister();
                  if ('caches' in window) {
                    const keys = await caches.keys();
                    await Promise.all(keys.map(key => caches.delete(key)));
                  }
                } catch (e) { add('CACHE CLEAN ERROR: ' + e); }
              });
            }
          })();
          </script>'''
          s = s.replace('</head>', patch + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          touch web/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
